<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ScreenGrid — Admin Centroid (Feature Anchors)</title>
    <link href="https://unpkg.com/maplibre-gl@^4/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
      html, body, #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; margin: 0; }
      .note {
        position: absolute; z-index: 10; top: 10px; left: 10px;
        background: rgba(255,255,255,0.9); padding: 8px 12px; border-radius: 6px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15); font-family: sans-serif; font-size: 13px;
      }
      code { background: #f5f5f5; padding: 1px 4px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div class="note">
      Minimal demo: centroid placement + feature-anchors.<br/>
      This uses the planned API (<code>source</code>, <code>placement</code>, <code>renderMode</code>) and may require a future build.
    </div>

    <script src="https://unpkg.com/maplibre-gl@^4/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/screengrid/dist/screengrid.umd.min.js"></script>
    <script>
      // Minimal inline GeoJSON with two simple polygons (rectangles)
      const adminGeoJSON = {
        "type": "FeatureCollection",
        "features": [
          {
            "type": "Feature",
            "properties": { "name": "Area A", "value": 10 },
            "geometry": {
              "type": "Polygon",
              "coordinates": [[
                [-122.50, 37.75],
                [-122.45, 37.75],
                [-122.45, 37.80],
                [-122.50, 37.80],
                [-122.50, 37.75]
              ]]
            }
          },
          {
            "type": "Feature",
            "properties": { "name": "Area B", "value": 30 },
            "geometry": {
              "type": "Polygon",
              "coordinates": [[
                [-122.44, 37.72],
                [-122.39, 37.72],
                [-122.39, 37.77],
                [-122.44, 37.77],
                [-122.44, 37.72]
              ]]
            }
          }
        ]
      };

      const map = new maplibregl.Map({
        container: 'map',
        style: 'https://tiles.openfreemap.org/styles/liberty',
        center: [-122.44, 37.76],
        zoom: 12
      });

      map.on('load', () => {
        const { ScreenGridLayerGL } = window.ScreenGrid;

        // Planned API: feature anchors mode with centroid placement
        const layer = new ScreenGridLayerGL({
          source: adminGeoJSON,
          placement: {
            strategy: 'centroid',
            partition: 'union'
          },
          renderMode: 'feature-anchors',
          anchorSizePixels: 18,
          enableGlyphs: true,
          onDrawCell: (ctx, x, y, normVal, cellInfo) => {
            const radius = cellInfo.glyphRadius || 10;
            ctx.fillStyle = 'rgba(46, 204, 113, 0.85)';
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, 2 * Math.PI);
            ctx.fill();
          }
        });

        map.addLayer(layer);

        // Optional: show hover info (planned event payload includes feature props when in feature-anchors mode)
        layer.setConfig({
          onHover: ({ anchor }) => {
            if (!anchor) return;
            map.getCanvas().style.cursor = 'pointer';
          },
          onClick: ({ anchor }) => {
            if (!anchor) return;
            const { props } = anchor;
            alert(`Feature: ${props?.name ?? 'Unknown'}\nValue: ${props?.value ?? 'N/A'}`);
          }
        });
      });
    </script>
  </body>
</html>
